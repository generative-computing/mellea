name: "Run CI"

on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions: {}

jobs:
  code-checks:
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    secrets:
      HF_TOKEN_READ_PUBLIC_ONLY: ${{ secrets.HF_TOKEN_READ_PUBLIC_ONLY }}

  actions-audit:
    permissions:
      contents: read
    uses: ./.github/workflows/actions-audit.yml

