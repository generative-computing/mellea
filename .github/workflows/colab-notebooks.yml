name: Colab Environment Notebooks

# Covers the one thing notebooks.yml cannot. There, the notebooks' Colab setup cells are
# tagged `skip-execution`, so the run exercises the working tree instead of the onboarding
# path a Colab user actually takes: the ollama install, and `uv pip install mellea`
# resolving against Colab's preinstalled package set. Both jobs here run those cells, via
# test/colab/run_notebooks.py.
#
# Split in two because Colab's published runtime image is 23 GB and cannot gate a PR:
#
#   colab-constraints  PR + dispatch.  Cheap. Resolves mellea against Colab's pinned
#                                      package set on a normal runner.
#   colab-image        nightly + dispatch. Slow. Runs the notebooks inside the real Colab
#                                      image, and regenerates the constraints file the
#                                      other job depends on.
#
# Advisory, and deliberately NOT part of ci.yml's `code-checks` aggregate: publish-release.yml
# depends on that aggregate, so a Colab-side change must not be able to block a release. Note
# that the constraints job is *stricter* than Colab: `-c` makes a conflict an error, whereas
# real Colab would upgrade the preinstalled package instead. A failure there means "mellea
# forces upgrades in Colab, check what moved", not "Colab is broken".
on:
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  # CICD=1 is what test/conftest.py checks to pick CI-appropriate behaviour; OLLAMA_HOST is
  # honoured by both `ollama serve` and the Mellea Ollama backend.
  CICD: 1
  OLLAMA_HOST: "127.0.0.1:5000"
  CONSTRAINTS_FILE: test/colab/colab-constraints.txt
  # Deliberately a moving tag rather than a digest: detecting Colab-side drift is the point
  # of the nightly job. The resolved digest is recorded in the job summary so a failure can
  # be attributed to a Colab change rather than to this repo.
  COLAB_IMAGE: us-docker.pkg.dev/colab-images/public/runtime:latest

jobs:
  colab-constraints:
    # Cheap path: no image pull, so this can run per-PR. Skipped on `schedule`, where the
    # image job is the whole point.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Read the recorded Colab environment
        # The constraints file is generated by the colab-image job, so on a fresh clone it
        # does not exist yet and there is nothing meaningful to test. Its `# python:` header
        # also drives the interpreter below, so this job always tests against the Python
        # Colab actually ships rather than a version hardcoded here.
        id: gate
        run: |
          if [ -f "$CONSTRAINTS_FILE" ]; then
            recorded=$(grep -m1 '^# python:' "$CONSTRAINTS_FILE" | awk '{print $3}')
            python_version=$(echo "$recorded" | cut -d. -f1,2)
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "python=${python_version:-3.12}" >> "$GITHUB_OUTPUT"
            echo "Colab records Python $recorded; using ${python_version:-3.12}"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "python=3.12" >> "$GITHUB_OUTPUT"
            {
              echo "### Skipped: no Colab constraints file yet"
              echo
              echo "\`$CONSTRAINTS_FILE\` has not been generated. Run this workflow via"
              echo "\`workflow_dispatch\`, download the \`colab-constraints\` artifact from"
              echo "the \`colab-image\` job, and commit it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install uv and set the python version
        if: steps.gate.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ steps.gate.outputs.python }}
          enable-cache: true
      - name: Preview the resolution against Colab's pins
        if: steps.gate.outputs.present == 'true'
        # Runs before the real install and never fails the job, so that when the install
        # below does fail, the summary already names the conflicting package.
        run: |
          uv venv .venv-colab
          uv pip install --python .venv-colab . -c "$CONSTRAINTS_FILE" --dry-run \
            >/tmp/resolution.txt 2>&1 || true
          {
            echo "<details><summary>mellea resolved against Colab's pinned packages</summary>"
            echo
            echo '```'
            cat /tmp/resolution.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/resolution.txt
      - name: Install mellea under Colab's pins
        if: steps.gate.outputs.present == 'true'
        # nbclient and ipykernel are constrained too, so the notebooks execute under the
        # same versions Colab ships rather than whatever is newest.
        run: |
          uv pip install --python .venv-colab . nbclient ipykernel -c "$CONSTRAINTS_FILE"
      - name: Stage the ollama model
        if: steps.gate.outputs.present == 'true'
        run: bash test/colab/prepare_ollama_model.sh
      - name: Execute notebooks with the Colab setup cells enabled
        if: steps.gate.outputs.present == 'true'
        env:
          # Absolute, because each notebook's cells run with the notebook's directory as
          # their cwd. This makes the notebooks' own `!uv pip install mellea` obey Colab's
          # pins; run_notebooks.py sets UV_OVERRIDE so it installs this tree.
          UV_CONSTRAINT: ${{ github.workspace }}/test/colab/colab-constraints.txt
        run: |
          .venv-colab/bin/python test/colab/run_notebooks.py --out-dir /tmp/colab-executed
      - name: Upload executed notebooks
        if: always() && steps.gate.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colab-constraints-executed-notebooks
          path: |
            /tmp/colab-executed/
            /tmp/ollama-serve.log
          if-no-files-found: warn
      - name: Dump the ollama server log on failure
        if: failure()
        run: |
          echo "=== ollama serve log (last 100 lines) ==="
          tail -n 100 /tmp/ollama-serve.log || echo "(no ollama serve log found)"

  colab-image:
    # The real thing: the notebooks run inside Colab's own runtime image. Nightly and
    # on demand only, because of the 23 GB pull.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Move Docker's data-root to /mnt
        # The image is ~23 GB compressed and larger extracted. A default runner has ~14 GB
        # free on / but ~65 GB on /mnt, so /var/lib/docker has to move before the pull.
        # docker.socket is stopped first, otherwise it restarts the daemon immediately.
        run: |
          df -h / /mnt
          sudo systemctl stop docker.socket docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'data-root: {{.DockerRootDir}}'
      - name: Pull the Colab runtime image
        run: |
          docker pull "$COLAB_IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$COLAB_IMAGE")
          tag=$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' \
            "$COLAB_IMAGE" | grep '^COLAB_RELEASE_TAG=' | cut -d= -f2)
          {
            echo "### Colab runtime image"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release tag | \`$tag\` |"
            echo "| Digest | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "COLAB_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "COLAB_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          df -h / /mnt
      - name: Extract Colab's package set
        # Read from the pristine image, before anything is installed, so the file describes
        # Colab and not Colab-plus-mellea. `pip list --format=freeze` rather than
        # `pip freeze`, whose `@ file://` direct-URL entries are not valid constraints.
        run: |
          mkdir -p /tmp/colab-out
          docker run --rm --entrypoint bash "$COLAB_IMAGE" -lc '
            python3 -c "import sys; print(\"# python: %d.%d.%d\" % sys.version_info[:3])"
            pip list --format=freeze 2>/dev/null | grep -E "^[A-Za-z0-9._-]+==" | sort
          ' >/tmp/colab-out/raw.txt
          {
            echo "# Colab's preinstalled package set, consumed by the colab-constraints job."
            echo "# Generated by .github/workflows/colab-notebooks.yml. Do not edit by hand."
            echo "# colab_release_tag: $COLAB_RELEASE_TAG"
            echo "# image_digest: $COLAB_IMAGE_DIGEST"
            cat /tmp/colab-out/raw.txt
          } >/tmp/colab-out/colab-constraints.txt
          echo "packages: $(grep -c '==' /tmp/colab-out/colab-constraints.txt)"
          head -8 /tmp/colab-out/colab-constraints.txt
      - name: Upload the generated constraints file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colab-constraints
          path: /tmp/colab-out/colab-constraints.txt
      - name: Compare against the committed constraints file
        # Comment lines are excluded: the release tag and digest change on every Colab image
        # release, which would report drift even when no package moved.
        run: |
          if [ ! -f "$CONSTRAINTS_FILE" ]; then
            echo "::notice::No committed constraints file yet. Download the colab-constraints artifact and commit it to enable the per-PR job."
            exit 0
          fi
          grep -v '^#' "$CONSTRAINTS_FILE" >/tmp/colab-out/committed.pkgs
          grep -v '^#' /tmp/colab-out/colab-constraints.txt >/tmp/colab-out/current.pkgs
          if diff -u /tmp/colab-out/committed.pkgs /tmp/colab-out/current.pkgs \
            >/tmp/colab-out/constraints.diff; then
            echo "Colab's package set is unchanged."
          else
            echo "::warning::Colab's package set has drifted. Refresh $CONSTRAINTS_FILE from the colab-constraints artifact."
            {
              echo "### Colab package drift"
              echo
              echo '```diff'
              head -60 /tmp/colab-out/constraints.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage the ollama model on the host
        # Staged on the host and mounted into the container so the multi-GB pull stays out
        # of the notebooks' per-cell timeout. The setup cells still install and serve ollama
        # inside the container, which is the part worth testing.
        run: bash test/colab/prepare_ollama_model.sh
      - name: Stop the host ollama daemon
        # The container serves its own on the same port in its own network namespace. There
        # is no conflict, but stopping this one removes any doubt about which daemon answered.
        run: |
          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f "ollama serve" || true
      - name: Execute notebooks inside the Colab image
        env:
          OUT_DIR: /tmp/colab-executed
        run: |
          mkdir -p "$OUT_DIR"
          docker run --rm \
            -v "$PWD":/work -w /work \
            -v "$OUT_DIR":/out \
            -v "$HOME/.ollama":/root/.ollama \
            -e OLLAMA_HOST -e CICD \
            -e GITHUB_STEP_SUMMARY=/out/summary.md \
            --entrypoint bash "$COLAB_IMAGE" -lc '
              set -euo pipefail
              # pdm-backend can consult git when collecting files for the wheel, and the
              # mounted tree belongs to a different uid than this container'"'"'s root.
              git config --global --add safe.directory /work
              command -v sudo >/dev/null || { apt-get update -qq && apt-get install -y -qq sudo; }
              python3 -c "import nbclient" 2>/dev/null || {
                echo "::warning::nbclient absent from the Colab image, installing it"
                uv pip install -q nbclient
              }
              python3 test/colab/run_notebooks.py --out-dir /out
            '
      - name: Fold the container summary into the job summary
        if: always()
        run: cat /tmp/colab-executed/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: colab-image-executed-notebooks
          path: |
            /tmp/colab-executed/
            /tmp/ollama-serve.log
          if-no-files-found: warn
