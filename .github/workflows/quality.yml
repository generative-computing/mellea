name: Verify Code Quality

on:
  workflow_call:
    secrets:
      HF_TOKEN_READ_PUBLIC_ONLY:
        description: "Hugging Face Hub READ-ONLY token (public repos only) for authenticated model/dataset access during tests."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  CICD: 1
  OLLAMA_HOST: "127.0.0.1:5000"

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2

  license-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check SPDX license headers
        run: python3 .github/scripts/check_license_headers.py --check

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # The GitHub secret HF_TOKEN_READ_PUBLIC_ONLY must be a READ-ONLY token on public
    # repositories: same-repo PR runs have access to this secret, so a write-scope
    # token could be exfiltrated by a malicious workflow change. It is exposed as the
    # env var HF_TOKEN (the name huggingface_hub picks up automatically) only on the
    # specific steps that need it, to limit exposure to unrelated steps like the
    # Ollama installer. Rotate via repo Settings -> Secrets and variables.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: pre-commit cache key
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      - name: Install dependencies
        run: uv sync --frozen --all-extras --group dev
      - name: Check HF_TOKEN
        continue-on-error: true
        env:
          # read-only public-repo HF token; environment gating not warranted
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ_PUBLIC_ONLY }}  # zizmor: ignore[secrets-outside-env]
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::warning::HF_TOKEN is NOT set — Hugging Face Hub calls will be anonymous."
            exit 0
          fi
          echo "HF_TOKEN is set; verifying with the Hugging Face Hub API..."
          {
          uv run python - <<'PY'
          import os, sys
          try:
              from huggingface_hub import HfApi
          except ImportError:
              print("::warning::huggingface_hub not installed in this env; skipping HF_TOKEN verification.")
              sys.exit(0)
          try:
              info = HfApi().whoami(token=os.environ["HF_TOKEN"])
              name = info.get("name") or info.get("fullname") or "<unknown>"
              print(f"::notice::HF_TOKEN is valid (user: {name}).")
          except Exception as e:
              print(f"::warning::HF_TOKEN is set but verification failed — token may be invalid or expired: {e}")
          PY
          } || echo "::warning::HF_TOKEN verification step could not run."
      - name: Check style and run tests
        id: precommit
        run: uv run pre-commit run --all-files
      - name: Send failure message pre-commit
        if: failure() # This step will only run if a previous step failed
        run: echo "The quality verification failed. Please run precommit "
      - name: Download NLTK data
        run: uv run python -m nltk.downloader punkt_tab
      - name: Install Ollama
        # Pinned to a GCC-13 build to fix a segfault loading Granite models on
        # AMX-capable ubuntu-latest runners (#1388). Ollama's Linux builds through
        # 0.32.1 were compiled with GCC 11, which miscompiles the AMX CPU kernels in
        # libggml-cpu-sapphirerapids.so -- so ~1/3 of runs (the AMX-capable runner
        # draws) crashed during model warmup, independent of ollama version and
        # unreachable by any env var (the code path is correct; the machine code was
        # not). Ollama PR #17244 ("bump Linux toolchain to GCC 13", Fixes ollama#17006
        # / #17205) first shipped in the 0.32.2 line. The rc0 tag has since been
        # removed (promoted to the v0.32.2 release), so its download URL now 404s and
        # the pin is bumped to 0.32.2. Drop this pin once a stable (non-prerelease)
        # release includes the GCC-13 build. NB: OLLAMA_VERSION must omit the leading
        # "v" -- install.sh prepends it (a "v" yields a broken .../download/vv0.32.2/...
        # path).
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.32.2 sh
      - name: Start serving ollama
        # Capture the server log: live-model stalls (read timeouts, empty
        # responses) are server-side, and without these lines the job log
        # shows nothing but the test failures. Dumped on failure below.
        run: nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
      - name: Pull models
        # granite-vision-4.1 is not in the Ollama library, so it is pulled from
        # IBM's official GGUF repo on Hugging Face (that build ships the mmproj
        # projector Ollama needs for image input). Drop the hf.co prefix if the
        # model is ever published to the Ollama library directly.
        run: |
          for model in granite4.2:3b granite4:micro-h hf.co/ibm-granite/granite-vision-4.1-4b-GGUF:Q4_K_M; do
            pulled=false
            for i in 1 2 3 4 5; do
              ollama pull "$model" && { pulled=true; break; }
              echo "Attempt $i to pull $model failed, retrying in 20s..."
              sleep 20
            done
            # Without this the loop exits 0 after exhausting every attempt: the
            # `&&` above puts the failure in a tested context, so `bash -e` does
            # not fire, and the loop's status comes from `sleep`. The step would
            # go green and the miss would surface 20 minutes later as a test
            # failure instead of an infra one.
            $pulled || { echo "::error::failed to pull $model after 5 attempts"; exit 1; }
          done
          # The names below are what the tests match against; print them so a
          # tag-name mismatch is diagnosable from the log alone.
          ollama list
      - name: Constrain the granite4.2:3b context for the CI runner
        # The published granite4.2:3b tag ships `num_ctx 131072` in its
        # Modelfile (granite4.1:3b carries no num_ctx, so CI always ran the
        # Ollama 4096 default). On the 4-vCPU/16 GB CPU-only runner the 131K
        # context allocates a ~6 GB KV cache at load time; the memory
        # pressure wedges inference for 15-30 minute windows, with requests
        # hanging at the client timeout and decodes crawling to ~0.3 tok/s
        # (runs 33048969379 and 33067783570; tracked in #1589). Re-point the
        # local tag at an 8192-context build of the same weights: tests
        # request the same tag name, so no test code changes. 8192 is 2x the
        # context every Ollama test on main uses.
        run: |
          ollama cp granite4.2:3b granite4.2:3b-128k
          printf 'FROM granite4.2:3b-128k\nPARAMETER num_ctx 8192\n' \
            > /tmp/MODELFILE-granite42-ci
          ollama create granite4.2:3b -f /tmp/MODELFILE-granite42-ci
          # grep exits non-zero (failing the step) if the parameter did not
          # land, so a silently-wrong build cannot pass CI.
          ollama show granite4.2:3b --modelfile | grep '^PARAMETER'
      - name: Run Tests
        id: tests
        env:
          # read-only public-repo HF token; environment gating not warranted
          HF_TOKEN: ${{ secrets.HF_TOKEN_READ_PUBLIC_ONLY }}  # zizmor: ignore[secrets-outside-env]
        run: >-
          uv run -m pytest -v --junit-xml=/tmp/pytest-results.xml
          test
          tooling/docs-autogen/test_validate.py
      - name: Send failure message tests
        if: failure() # This step will only run if a previous step failed
        run: echo "Tests failed. Please verify that tests are working locally."
      - name: Dump Ollama server log on failure
        if: failure() # Only the test step can produce a useful server log here.
        # The raw log is far too verbose to dump whole (slot print_timing lines
        # every ~25 tokens: a plain tail of 100 lines only covers ~30 s of the
        # run and misses multi-minute stall windows), so dump the request-level
        # story instead: one GIN line per HTTP request (with its duration), any
        # error/warning lines, and model load/unload events -- then a short raw
        # tail for the final moment.
        run: |
          echo "=== ollama serve log: requests (GIN), errors, model events ==="
          grep -iE 'GIN|error|warn|panic|loading|unload' /tmp/ollama-serve.log | tail -n 500 || echo "(no matching lines)"
          echo "=== ollama serve log (last 50 raw lines) ==="
          tail -n 50 /tmp/ollama-serve.log || echo "(no ollama serve log found)"
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PYEOF'
          import os, xml.etree.ElementTree as ET

          python_version = os.environ.get("PYTHON_VERSION", "")
          precommit_outcome = os.environ.get("STEPS_PRECOMMIT_OUTCOME", "")
          test_outcome = os.environ.get("STEPS_TESTS_OUTCOME", "")

          def icon(outcome):
              return "✅" if outcome == "success" else ("❌" if outcome == "failure" else "⏭️")

          lines = [
              f"## Code Quality — Python {python_version}\n",
              "| Check | Result |",
              "|-------|--------|",
              f"| Pre-commit (ruff, mypy, uv-lock, codespell, markdownlint) | {icon(precommit_outcome)} {precommit_outcome} |",
              f"| Tests | {icon(test_outcome)} {test_outcome} |",
              "",
          ]

          try:
              tree = ET.parse("/tmp/pytest-results.xml")
              root = tree.getroot()
              # JUnit XML may be a <testsuites> wrapper or a bare <testsuite>
              suite = root if root.tag == "testsuite" else root.find("testsuite") or root
              attrs = suite.attrib
              total = int(attrs.get("tests", 0))
              failures = int(attrs.get("failures", 0))
              errors = int(attrs.get("errors", 0))
              skipped = int(attrs.get("skipped", 0))
              passed = total - failures - errors - skipped
              lines.append(
                  f"**Tests:** {passed} passed, {failures} failed, {errors} errors, "
                  f"{skipped} skipped ({total} total)\n"
              )
              if failures + errors > 0:
                  lines.append("**Failed tests:**\n")
                  for tc in root.iter("testcase"):
                      fail = tc.find("failure") or tc.find("error")
                      if fail is not None:
                          name = f"{tc.get('classname', '')}.{tc.get('name', '')}"
                          lines.append(f"- `{name}`")
                  lines.append("")
          except Exception:
              pass  # pytest didn't run or XML unavailable

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines))
          PYEOF
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          STEPS_PRECOMMIT_OUTCOME: ${{ steps.precommit.outcome }}
          STEPS_TESTS_OUTCOME: ${{ steps.tests.outcome }}
